name: Build & Release Luci App NVR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    name: OpenWrt ${{ matrix.version }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.5"
            arch: "mediatek-filogic"
            go_arch: "arm64"
            sdk_url: "https://archive.openwrt.org/releases/24.10.5/targets/mediatek/filogic/openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_type: "ipk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compile nvr-core (Go binary, static)
        run: |
          cd nvr-core
          GOOS=linux GOARCH=${{ matrix.go_arch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../nvr-core-bin .
          cd ..
          file nvr-core-bin

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip zstd
          sudo -E apt-get clean

      - name: Compile Package
        run: |
          # 1. 下载对应版本的 SDK
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar.zst
          mkdir sdk_env
          zstd -d sdk.tar.zst -o sdk.tar
          tar xf sdk.tar -C sdk_env --strip-components=1
          
          # 2. 准备插件目录（含预编译的 Go 二进制 nvr-core-bin）
          PKG_DIR="sdk_env/package/luci-app-nvr"
          mkdir -p "$PKG_DIR"
          cp Makefile "$PKG_DIR/"
          cp nvr-core-bin "$PKG_DIR/"
          [ -d "luasrc" ] && cp -r luasrc "$PKG_DIR/"
          [ -d "files" ] && cp -r files/* "$PKG_DIR/"
          [ -d "po" ] && cp -r po "$PKG_DIR/"
          
          # 3. 激活配置
          cd sdk_env
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-app-nvr=m" >> .config
          make defconfig
          
          # 4. 执行编译
          make package/luci-app-nvr/compile V=s -j$(nproc)
          
          # 5. 诊断搜索
          echo "==== 检查生成的 ${{ matrix.pkg_type }} 文件 ===="
          find bin/ -name "*.${{ matrix.pkg_type }}"

      - name: Collect and rename package
        run: |
          mkdir -p pkg-out
          # 重命名为简洁标准名
          find sdk_env/bin/ -name "*.${{ matrix.pkg_type }}" -type f \
            -exec cp {} pkg-out/luci-app-nvr.${{ matrix.pkg_type }} \;
          echo "==== 最终产物 ===="
          ls -la pkg-out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg-out/*
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: build
    # 仅在 tag 推送或手动触发时发布；普通 push main 只做编译验证
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release / Tag 所需权限
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true   # 所有架构产物合并到同一目录

      - name: List release assets
        run: ls -la assets/

      - name: Compute release tag & prerelease flag
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # tag 触发：使用该 tag，正式发布
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # 手动触发：生成 nightly 预发布 tag
            echo "tag=nightly-$(date -u +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true   # 自动生成变更日志（基于 commit）
          files: assets/*
